name = "cloudphone"
main = "src/index.ts"
compatibility_date = "2025-06-17"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cloudphone"
database_id = "00000000-0000-0000-0000-000000000000"

